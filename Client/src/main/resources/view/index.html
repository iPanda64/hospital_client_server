<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OCSF Client</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="navigation.css"> <!-- previous/next css-->
</head>
<body>
    <h1>JavaFX Web Client</h1>
    <div id="chat-area">
        <div id="log"></div>
    </div>
    <div id="input-area">
        <input type="text" id="message" placeholder="Type a message..."/>
        <button onclick="sendMessage()">Send</button>
    </div>
    <!-- previous/next start -->
    <div id="nav-bar">
        <button id="btn-prev" class="nav-btn" onclick="previous()">« Previous</button>
        <button id="btn-next" class="nav-btn" onclick="next()">Next »</button>
    </div>
    <!-- previous/next end -->
    <script src="script.js"></script>
</body>
</html>
